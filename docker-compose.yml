services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wahay
      POSTGRES_PASSWORD: wahay_dev_password
      POSTGRES_DB: wahay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wahay"]
      interval: 5s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    environment:
      WAHA_DEFAULT_ENGINE: WEBJS
    ports:
      - "3001:3000"

volumes:
  postgres_data:
